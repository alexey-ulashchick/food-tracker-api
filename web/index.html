<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the notch and the home
         indicator; the safe-area insets then keep content clear of both. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <!-- Both schemes, so the UA renders form controls and scrollbars to match
         and does not force-darken anything itself. The app follows the OS; there
         is no in-app switch, and no `dark` class on <html> to imply one. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <title>Cal Tracker</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Standalone mode on iOS still needs the legacy pair: the manifest alone
         does not remove Safari's chrome when launched from the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent. With it, iOS starts the webview at the physical
         top of the screen but still sizes it as if the status bar were opaque
         (912 - 68 on the device this was measured on), so the bottom 68pt of the
         screen fall outside the window entirely — a band nothing can paint into,
         which is what left the tab bar short of the edge. Raising the shell's
         height only got it clipped at the window boundary.

         Opaque puts the window below the status bar and lets it run to the
         bottom, so the bar reaches the edge.

         This one does NOT follow the colour scheme: the meta takes no media
         attribute and iOS caches it at install time, so an installed app in
         light mode keeps a black status bar above a light UI. Changing it is
         exactly what produced the unpaintable band above, so it wants its own
         pass on a real device rather than a guess here. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="CalTracker" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
